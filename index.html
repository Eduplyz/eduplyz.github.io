<style>
  :root { --fundo: #140f2b; --cartao: #231a45; --cartao2: #2e2259; --texto: #fff; --suave: #c8bdf0;
          --rosa: #ff1f96; --azul: #1e7bff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--texto); font-family: Montserrat, system-ui, sans-serif;
         background:
           radial-gradient(circle at 15% 0%, rgba(255,31,150,.35) 0%, transparent 45%),
           radial-gradient(circle at 85% 10%, rgba(30,123,255,.35) 0%, transparent 45%),
           var(--fundo);
         display: flex; justify-content: center; padding: 40px 16px 56px; }
  main { width: 100%; max-width: 460px; text-align: center; }
  .avatar { width: 132px; height: 132px; border-radius: 50%; object-fit: cover;
            border: 4px solid transparent;
            background: linear-gradient(var(--fundo), var(--fundo)) padding-box, linear-gradient(135deg, var(--rosa), var(--azul)) border-box;
            box-shadow: 0 0 28px rgba(255,31,150,.35), 0 0 28px rgba(30,123,255,.25); }
  .nome { display: block; width: 230px; max-width: 70%; margin: 14px auto 4px; }
  .bio { color: var(--suave); font-size: 15px; line-height: 1.55; margin: 0 0 8px; }
  .aovivo { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #fff;
            background: rgba(255,31,150,.15); border: 1px solid rgba(255,31,150,.45); border-radius: 999px; padding: 6px 14px; margin: 6px 0 20px; }
  .ponto { width: 9px; height: 9px; border-radius: 50%; background: #ff2d4a; box-shadow: 0 0 0 0 rgba(255,45,74,.7); animation: pulsar 1.6s infinite; }
  @keyframes pulsar { 0% { box-shadow: 0 0 0 0 rgba(255,45,74,.7);} 70% { box-shadow: 0 0 0 8px rgba(255,45,74,0);} 100% { box-shadow: 0 0 0 0 rgba(255,45,74,0);} }
  h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); margin: 26px 0 12px; font-weight: 600; }
  a.botao { display: flex; align-items: center; gap: 14px; background: var(--cartao); color: var(--texto); text-decoration: none; padding: 15px 18px;
            border-radius: 16px; margin-bottom: 12px; font-weight: 600; font-size: 16px; border: 1px solid rgba(255,255,255,.07);
            transition: transform .12s, background .12s, border-color .12s; }
  a.botao:hover, a.botao:focus-visible { transform: translateY(-2px); background: var(--cartao2); border-color: rgba(255,31,150,.5); outline: none; }
  .ic { width: 30px; height: 30px; flex: none; }
  a.botao span { flex: 1; text-align: left; }
  a.botao small { display: block; color: var(--suave); font-weight: 500; font-size: 13px; margin-top: 2px; }
  .seta { color: var(--suave); font-size: 18px; }
  footer { color: #8f84bd; font-size: 12px; margin-top: 30px; }
  @media (prefers-reduced-motion: reduce) { .ponto { animation: none; } a.botao { transition: none; } }
</style>
